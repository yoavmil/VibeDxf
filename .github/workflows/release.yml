name: Windows release
on:
  push:
    branches: [main]
    paths: ['packaging/**', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content packaging/version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag and packaging/version.txt disagree' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $PSNativeCommandUseErrorActionPreference = $false
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          $published = $LASTEXITCODE -eq 0 -and -not ($existing | ConvertFrom-Json).isDraft
          "publish=$(-not $published)" >> $env:GITHUB_OUTPUT
          if ($published) { Write-Host "$tag is already published; leaving it unchanged." }
          $global:LASTEXITCODE = 0
      - name: Run checks
        if: steps.version.outputs.publish == 'True'
        shell: pwsh
        run: dotnet run --project Tests/VibeDxf.Checks.csproj -c Release
      - name: Build framework-dependent installer
        if: steps.version.outputs.publish == 'True'
        shell: pwsh
        run: ./packaging/Build-Installer.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Verify installer and uninstall
        if: steps.version.outputs.publish == 'True'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $setup = Join-Path $PWD "artifacts/release/$version/downloads/VibeDxf-Setup-$version-win-x64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP 'VibeDxf-install-check'
          $proc = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=`"$installDir`"",'/TASKS=') -WindowStyle Hidden -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or -not (Test-Path "$installDir/VibeDxf.exe")) { throw "Installer failed: $($proc.ExitCode)" }
          if (Test-Path "$installDir/coreclr.dll") { throw 'Installer included the runtime' }
          $proc = Start-Process -FilePath "$installDir/unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -WindowStyle Hidden -Wait -PassThru
          if ($proc.ExitCode -ne 0 -or (Test-Path "$installDir/VibeDxf.exe")) { throw "Uninstall failed: $($proc.ExitCode)" }
      - name: Create Git tag and publish downloads
        if: steps.version.outputs.publish == 'True'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tag = '${{ steps.version.outputs.tag }}'
          $version = '${{ steps.version.outputs.version }}'
          $headSha = git rev-parse HEAD
          $PSNativeCommandUseErrorActionPreference = $false
          git rev-parse --verify "refs/tags/$tag" 2>$null
          $tagExists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $true
          if ($tagExists) {
            $tagSha = git rev-parse "$tag^{commit}"
            if ($tagSha -ne $headSha) { throw "$tag already points to a different commit" }
          } else {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $tag -m "VibeDxf $tag" $headSha
            git push origin "refs/tags/$tag"
          }
          $downloads = Join-Path $PWD "artifacts/release/$version/downloads"
          $assets = @("$downloads/VibeDxf-Setup-$version-win-x64.exe", "$downloads/VibeDxf-$version-win-x64.zip", "$downloads/SHA256SUMS.txt")
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $true
          if ($releaseExists) {
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "VibeDxf $tag" --notes-file packaging/RELEASE_NOTES.md
          }
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false --latest
