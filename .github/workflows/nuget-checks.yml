name: NuGet checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nuget-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build desktop app and library
        run: dotnet build VibeDxf.sln -c Release
      - name: Regression and GPU checks
        run: dotnet test Tests/VibeDxf.Checks.csproj -c Release --no-build --logger "trx;LogFileName=nuget-checks.trx"
      - name: Pack exact source and test isolated consumers
        shell: pwsh
        run: ./tools/Test-LocalPackage.ps1 -Release -ExpectedCommit $env:GITHUB_SHA
      - name: Retain checks and package candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-checks-${{ github.sha }}
          retention-days: 14
          path: |
            Tests/TestResults/
            artifacts/test-report/
            artifacts/nuget/release/
            artifacts/nuget/validation/**/summary.json
            artifacts/nuget/validation/**/console-output.txt
            artifacts/nuget/validation/**/wpf-smoke.json
